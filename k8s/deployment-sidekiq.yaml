apiVersion: apps/v1
kind: Deployment
metadata:
  name: clara-bornan-sidekiq
  namespace: client-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clara-bornan-sidekiq
  template:
    metadata:
      labels:
        app: clara-bornan-sidekiq
    spec:
      initContainers:
        - name: wait-for-db
          image: bornan.azurecr.io/clara-bornan:latest
          imagePullPolicy: Always
          command: ["/bin/sh","-c"]
          args:
            - >
              until pg_isready -h "$POSTGRES_HOST" -p "${POSTGRES_PORT:-5432}" -U "$POSTGRES_USERNAME";
              do echo 'Aguardando Postgres...'; sleep 2; done
          envFrom:
            - configMapRef:
                name: clara-bornan-config
            - secretRef:
                name: clara-bornan-secrets
      containers:
        - name: sidekiq
          image: bornan.azurecr.io/clara-bornan:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "docker/entrypoints/rails.sh"]
          args: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
          envFrom:
            - configMapRef:
                name: clara-bornan-config
            - secretRef:
                name: clara-bornan-secrets
          env:
            - name: RAILS_ENV
              value: "production"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "300m"
              memory: "1Gi"
